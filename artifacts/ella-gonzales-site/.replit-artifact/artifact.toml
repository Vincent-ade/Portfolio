kind = "web"
previewPath = "/"
title = "Vincent Gonzales"
description = "A personal website for Vincent Gonzales, sharing her technology journey, creator work, career resources, and ways to collaborate. Includes working navigation, resource filters, and links to the original newsletter and resource destinations."
version = "1.0.0"
id = "artifacts/ella-gonzales-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19591

[services.development]
run = "pnpm --filter @workspace/vincent-gonzales-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vincent-gonzales-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/ella-gonzales-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19591"
BASE_PATH = "/"
